name: ci

on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets — not only those into main. A change
  # is often proposed onto another branch first, and the checks below are exactly
  # as meaningful there; restricting them to main would also mean this workflow
  # first runs on the merge that makes it protected.
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch / pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only checks out and builds, so the token needs
# nothing beyond read access to the repository contents.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: Build & read back (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Build plus one sample run finishes in well under a minute; cap a hung runner.
    timeout-minutes: 15
    strategy:
      # Run both legs to completion so a platform-specific failure is always visible.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Two versions on purpose: the 10 SDK builds (LangVersion is latest), and the
      # 8 runtime runs the sample project, which targets the newest framework the
      # library supports.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DesignPatternCatalog.sln

      # The library multi-targets netstandard2.0 through net8.0, so a change that
      # compiles on the newest target may not compile on the oldest. Building the
      # solution exercises every one of them.
      - name: Build
        run: dotnet build DesignPatternCatalog.sln -c Release --no-restore

      # Packing is where NuGet checks each package's own metadata — a missing licence, a readme declared and
      # not packed, an empty lib folder are all NU5xxx warnings, which the ratchet promotes to errors here.
      # Nothing is published by this workflow; producing the packages is what proves they can be produced.
      # The whole solution is packed rather than one project: since ADR-0027 there are eight packages, and the
      # tests and samples declare IsPackable=false so they are skipped.
      - name: Pack
        run: dotnet pack DesignPatternCatalog.sln -c Release --no-build

      # The attributes carry no behaviour, so nothing here tests what code does.
      # What these assert is what every generated attribute must LOOK like — it
      # derives from the base, it declares what it applies to, every role of one
      # pattern answers one identity — plus what the reading rules answer for each
      # shape the generator emits, over fixtures rather than catalog entries. A
      # defect written into the template is emitted uniformly, survives the round
      # trip and is invisible in a diff spanning the whole catalog; this is where
      # it shows. Deferred by ADR-0016 and ADR-0018, required by ADR-0019.
      - name: Convention tests
        run: dotnet test DesignPatternCatalog.sln -c Release --no-build

      # The whole catalog reads back through the base attribute alone — the
      # contract of ADR-0004 — which is exactly what the sample project's
      # inventory does. A role that cannot be applied to a plausible participant
      # already failed to compile above; this shows the annotations are also
      # readable, on a body of code written to be read rather than to be asserted.
      - name: Read the catalog back through the sample project
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project DesignPatternCatalog.Usage -c Release --no-build > inventory.txt
          cat inventory.txt
          # Positive proof, not just exit 0.
          if ! grep -Eq '^[0-9]+ annotations, covering [0-9]+ patterns and [0-9]+ distinct roles\.$' inventory.txt; then
            echo "::error::the sample project did not report an inventory"
            exit 1
          fi
          if grep -q '^0 annotations' inventory.txt; then
            echo "::error::the sample project reported an empty inventory"
            exit 1
          fi

  catalog:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No setup-python action: the runner image already carries python3, and the
      # validator needs nothing beyond it and one pinned package. One fewer action
      # to pin, review and keep current.
      - name: Install the validator's dependency
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check -r tools/catalog/requirements.txt

      # A schema error is what makes a catalog written in bulk reviewable: a missing
      # role, an unknown target or a link to a role that does not exist becomes a
      # failure rather than something to notice by reading (ADR-0002).
      - name: Validate the catalog
        run: python3 tools/catalog/validate.py

      # The release planner decides which packages a tag publishes and at which version (ADR-0044). It runs
      # for real only at release time, so its rules are exercised here, on every pull request.
      - name: Test the release planner
        run: python3 -m unittest discover -s tools/release

      # ADR-0002 states that regenerating an unchanged catalog leaves the working
      # tree clean. That invariant is what keeps the data and the sources from
      # diverging, and it is the only thing standing between the repository and a
      # generated attribute quietly edited by hand.
      - name: Regenerate and prove the sources match the catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 catalog/generate.py
          if ! git diff --quiet; then
            echo "::error::regenerating the catalog changed the committed sources"
            echo
            echo "Either a generated attribute was edited by hand, or the catalog was"
            echo "changed without running 'python3 catalog/generate.py'."
            echo
            git diff --stat
            git diff
            exit 1
          fi
          echo "ok: the committed sources are exactly what the catalog generates"
